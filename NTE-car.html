<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTE Gacha Simulator</title>
  <meta name="author" content="僠儖僲">
  <link rel="author" href="https://space.bilibili.com/517723/">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-50%20-59%20100%20100%22%3E%3Ctext%20font-size%3D%2290%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3E%F0%9F%8E%B2%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="https://unpkg.com/view-ui-plus@1.3.21/dist/styles/viewuiplus.css">
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.22/dist/vue.runtime.esm-browser.js",
        "iview": "https://unpkg.com/view-ui-plus@1.3.21/dist/viewuiplus.min.esm.js"
      }
    }
  </script>
  <script type="module">
    /**
     * @createDate 2026-06-02
     */
    import { createApp, shallowReactive, createVNode as h, onMounted } from 'vue'
    import { Row, Col, Card, Button, Table } from 'iview'

    const parseCsv = (input) => {
      const [header, ...list] = String(input).trim().split('\n')
      const columns = []
      for (const key of String(header).split(',')) {
        columns[columns.length] = { __proto__: null, title: key, key }
      }
      const data = []
      for (const line of list) {
        const item = { __proto__: null }
        String(line).split(',').forEach((value, i) => {
          item[columns[i].key] = value
        })
        data[data.length] = item
      }
      return { columns, data }
    }

    const priceInfo = parseCsv(`\
环石价格,方斯价格
50,50_000
80,80_000
100,100_000
150,150_000
200,200_000
300,300_000
500,500_000
600,800_000
800,1_000_000
1200,1_500_000
1400,2_000_000
1600,2_500_000
1800,3_000_000
2000,3_500_000
2200,4_200_000
`)
    priceInfo.columns.unshift({ type: 'index', width: 60, align: null })
    for (const col of priceInfo.columns) {
      col.align = 'right'
    }
    for (const item of priceInfo.data) {
      item['方斯价格'] = item['方斯价格'].replaceAll('_', ',')
    }
    const itemInfo = parseCsv(`\
奖品名称,数量,1-5抽权重,6-15抽权重
赛车「Porsche 918 Spyder」,1,0,1
换装「最佳拍档」,1,3,3
捏造骰子*10,1,5,5
一封手写信*3,1,10,10
方斯*500000,1,10,10
头像框「砰然瞬间」,1,99,99
名片「赛道掠影」,1,99,99
捏造骰子*3,1,99,99
浮冰影券*3,1,99,99
方斯*100000,1,99,99
无梦果核*10,1,99,99
特级猎人攻略*10,2,99,99
甲硬币*100000,2,99,99
`)
    itemInfo.columns[1].width = 80
    for (const i of [2, 3]) {
      itemInfo.columns[i].width = 120
    }

    const app = createApp({
      setup(props, { expose }) {
        const resultHeader = [
          { type: 'index', width: 60, align: 'center' },
          { title: '道具名称', key: '奖品名称' }
        ]
        const result = shallowReactive([])

        onMounted(() => {
          next()
        })

        const createBox = () => {
          const box = []
          for (const item of itemInfo.data) {
            const len = +item['数量']
            let i = 0; for (; i < len; i++) {
              box[box.length] = item
            }
          }
          return box
        }

        const next = () => {
          result.length = 0
          const box = createBox()

          const buf = new BigUint64Array(1)
          let i = 0; for (; box.length > 0; i++) {
            const weightList = []
            for (const item of box) {
              const weight = +item[`${i < 5 ? '1-5' : '6-15'}抽权重`]
              let j = 0; for (; j < weight; j++) {
                weightList[weightList.length] = item
              }
            }

            crypto.getRandomValues(buf)
            const get = weightList[buf[0] % BigInt(weightList.length)]
            box.splice(box.indexOf(get), 1)
            result[result.length] = get
          }
        }
        const test = () => {
          const _count = Array.from(createBox(), () => 0)
          const counter = Array.from(itemInfo.data, (item) => ({ item, count: [..._count] }))
          for (let i = 0; i < 10000; i++) {
            next()
            for (const { item, count } of counter) {
              count[result.indexOf(item)]++
            }
          }
          return counter
        }
        expose({ itemInfo, resultHeader, result, next, test })
        return () => h(Row, { gutter: 8, style: 'margin:20px 10px' }, () => [
          h(Col, { span: 12 }, () => [
            h(Card, null, {
              title: () => [
                h(Button, { onClick: next }, () => ['抽取'])
              ],
              default: () => [
                h(Table, { stripe: true, border: true, columns: resultHeader, data: result })
              ]
            })
          ]),
          h(Col, { span: 12 }, () => [
            h(Card, { title: '权重' }, () => [
              h(Table, { stripe: true, border: true, ...itemInfo })
            ]),
            h(Card, { title: '价格' }, () => [
              h(Table, { stripe: true, border: true, ...priceInfo })
            ]),
          ])
        ])
      }
    })
    const vm = app.mount('#app')
    window.vm = vm
  </script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
